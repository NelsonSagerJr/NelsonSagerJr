name: Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NelsonSagerJr
          template: classic
          filename: metrics.svg
          config_timezone: America/Sao_Paulo
          base: header, repositories, metadata
          base_indepth: yes
          repositories_forks: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 300
          plugin_habits_days: 365
          plugin_habits_charts: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://nelsonsagerjr.github.io/duofinance/
